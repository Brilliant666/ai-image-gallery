# /etc/nginx/sites-available/photoai
#
# 目标拓扑：单域名路径式
#   https://photoai.life/            入口页
#   https://photoai.life/portrait/   人像集
#   https://photoai.life/costume/    服装集
#   https://photoai.life/pose/       姿势集（线稿，可切换深度图）
#   https://photoai.life/pose-depth/ 姿势集的深度图入口
#   https://photoai.life/shisei/     CC0 姿势线稿
#
# 站点根：/srv/ai-image-gallery/dist
#   （由 tools/release.py 生成，图片为硬链接，切换版本只需重跑 release）
#
# 前置条件：
#   1. photoai.life 与 www.photoai.life 已解析到本机
#   2. 已签发证书：certbot --nginx -d photoai.life -d www.photoai.life
#   3. 旧子域名证书保留（用于 301 迁移）
#
# 启用：
#   ln -sf /etc/nginx/sites-available/photoai /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/refsite-pose /etc/nginx/sites-enabled/refsite-costume
#   nginx -t && systemctl reload nginx

# ── 主域：HTTP 跳 HTTPS（保留 ACME 挑战路径）──
server {
    listen 80;
    listen [::]:80;
    server_name photoai.life www.photoai.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://photoai.life$request_uri; }
}

# ── 主域：站点主体 ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name photoai.life www.photoai.life;

    ssl_certificate     /etc/letsencrypt/live/photoai.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoai.life/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:photoaiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/ai-image-gallery/dist;

    access_log /var/log/nginx/photoai.access.log;
    error_log  /var/log/nginx/photoai.error.log;

    # 12000+ 图片文件的元数据缓存
    open_file_cache          max=20000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # index / charset / 安全头 / 404 / 图片缓存 / 目录穿越防护
    include /etc/nginx/snippets/refsite-static.conf;

    # 可选：文本压缩（页面内联数据较多，gzip 后约为原来的 1/6）。线上已有同等配置时不要重复加
    # gzip on; gzip_vary on; gzip_min_length 1024;
    # gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
}

# ── 旧子域名迁移：301 到新路径 ──
# 保留原证书，避免旧链接直接断掉
server {
    listen 80;
    server_name pose.photoai.life;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://photoai.life/pose$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name pose.photoai.life;
    ssl_certificate     /etc/letsencrypt/live/pose.photoai.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pose.photoai.life/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://photoai.life/pose$request_uri;
}

server {
    listen 80;
    server_name costume.photoai.life;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://photoai.life/costume$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name costume.photoai.life;
    ssl_certificate     /etc/letsencrypt/live/costume.photoai.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/costume.photoai.life/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://photoai.life/costume$request_uri;
}

# ── 未知 Host：直接拒绝（沿用现有默认站策略）──
# refsite-default 已处理 80 返回 444、443 拒绝握手，此处不重复。

# /etc/nginx/sites-available/ai-image-gallery
#
# 站点根指向 tools/release.py 生成的 dist/：
#   dist/index.html        入口页
#   dist/portrait/         各子站
#   dist/pose/
#   dist/pose-depth/
#   dist/costume/
#
# dist/ 是扁平结构，入口页的 ./portrait/ 链接直接命中，不需要 alias。
#
# 部署前替换域名（共 4 处）：
#   sed -i 's/你的域名\.com/实际域名.com/g' /etc/nginx/sites-available/ai-image-gallery
#
# 启用：
#   ln -sf /etc/nginx/sites-available/ai-image-gallery /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 20.04/22.04 自带 nginx 1.18，用这种写法
    # nginx ≥ 1.25.1 请改为：listen 443 ssl; listen [::]:443 ssl; http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 你的域名.com;

    ssl_certificate     /etc/letsencrypt/live/你的域名.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /srv/ai-image-gallery/dist;
    index index.html;

    charset utf-8;
    autoindex off;

    # ── 传输优化 ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 12000+ 小文件的元数据缓存
    open_file_cache          max=20000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── 压缩：只压文本，图片本身已压缩 ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 安全响应头 ──
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ── 图片：内容永不变，一年强缓存 ──
    # 匹配 /<任意站点>/(thumbs|img|png)/ 下的所有图片
    location ~ ^/[^/]+/(thumbs|img|png)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # ── 页面与清单：每次回源验证，避免改版后看到旧页面 ──
    location ~* \.(html|json|csv|xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── 可选：单 IP 并发限制 ──
    # 需先在 http{} 里加：limit_conn_zone $binary_remote_addr zone=addr:10m;
    # limit_conn addr 16;
    # limit_conn_status 429;

    # ── 可选：私有化（访问控制）──
    # apt install apache2-utils && htpasswd -c /etc/nginx/.htpasswd yourname
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ── 可选：防盗链（加在上面的图片 location 内）──
    # valid_referers none blocked server_names *.你的域名.com;
    # if ($invalid_referer) { return 403; }
}
